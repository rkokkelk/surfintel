[project]
name = "surfintel-backend"
version = "0.1.0"
description = "SurfIntel backend — ingestion, enrichment and alerting API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "pydantic[email]>=2.7",
  "pydantic-settings>=2.3",
  "pyjwt>=2.8",
  "bcrypt>=4.1",
  "cryptography>=42.0",
  "feedparser>=6.0",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "apprise>=1.8",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.5",
]

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
