services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: surfintel
      POSTGRES_PASSWORD: surfintel
      POSTGRES_DB: surfintel
    ports:
      - "5432:5432"
    volumes:
      - surfintel-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U surfintel"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - surfintel-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3


  playwright:
    image: mcr.microsoft.com/playwright:v1.64.0-resolute
    init: true
    user: pwuser
    working_dir: /home/pwuser
    ports:
      - 3001:3000
    command: /bin/sh -c "npx -y playwright@1.64.0 run-server --port 3000 --host 0.0.0.0"

volumes:
  surfintel-db:
  surfintel-redis:
