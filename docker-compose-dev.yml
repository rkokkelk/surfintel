services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: surfintel
      POSTGRES_PASSWORD: surfintel
      POSTGRES_DB: surfintel
    ports:
      - "5432:5432"
    volumes:
      - surfintel-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U surfintel"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  surfintel-db:
