services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: surfintel
      POSTGRES_PASSWORD: surfintel
      POSTGRES_DB: surfintel
    ports:
      - "5432:5432"
    volumes:
      - surfintel-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U surfintel"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - surfintel-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  surfintel-db:
  surfintel-redis:
